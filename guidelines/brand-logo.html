<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 22px; background: var(--surface-page); font-family: var(--font-text); }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .col { display: flex; flex-direction: column; }
  .sw { flex: 1; border-radius: var(--radius-tile); overflow: hidden; border: 1px solid var(--border); }
  .sw i { display: block; height: 56px; }
  .sw b { display: block; font-size: 13px; font-weight: 600; padding: 8px 10px 2px; color: var(--text-primary); }
  .sw code { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; padding: 0 10px 9px; color: var(--text-muted); }
  
</style>
</head>
<body>
<div class="row" style="align-items:center;">
  <div style="flex:1;display:flex;flex-direction:column;gap:12px;"><img src="../assets/logo/oneline-green.png" alt="One-line green" style="width:100%;"><img src="../assets/logo/oneline-black.png" alt="One-line black" style="width:100%;"></div>
  <div style="flex:0 0 190px;background:var(--navy);border-radius:var(--radius-tile);padding:16px;display:flex;align-items:center;justify-content:center;"><img src="../assets/logo/stacked-white.png" alt="Stacked white" style="width:150px;"></div>
  <div style="flex:0 0 190px;background:var(--green);border-radius:var(--radius-tile);padding:16px;display:flex;align-items:center;justify-content:center;"><img src="../assets/logo/stacked-black.png" alt="Stacked black" style="width:150px;"></div>
</div>
</body>
</html>
