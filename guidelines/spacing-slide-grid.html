<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 22px; background: var(--surface-page); font-family: var(--font-text); }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .col { display: flex; flex-direction: column; }
  .sw { flex: 1; border-radius: var(--radius-tile); overflow: hidden; border: 1px solid var(--border); }
  .sw i { display: block; height: 56px; }
  .sw b { display: block; font-size: 13px; font-weight: 600; padding: 8px 10px 2px; color: var(--text-primary); }
  .sw code { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; padding: 0 10px 9px; color: var(--text-muted); }
  
</style>
</head>
<body>
<div style="border:1px solid var(--border);border-radius:var(--radius-tile);overflow:hidden;">
  <div style="height:4px;background:var(--green);"></div>
  <div style="aspect-ratio:16/9;padding:3.7% 3.75%;display:flex;flex-direction:column;position:relative;">
    <div style="font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--text-eyebrow);"><span style="color:var(--green-ink);letter-spacing:-.18em;margin-right:.32em;display:inline-block;">//</span>Eyebrow</div>
    <div style="font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1;margin-top:4%;">Slide title 80px</div>
    <div style="flex:1;margin-top:3.4%;border:1px dashed var(--border-inactive);border-radius:8px;background:var(--hatch);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-faint);">content zone · y 430</div>
    <div style="display:flex;align-items:center;margin-top:2.2%;font-size:8px;color:var(--text-footer);"><span>logo 22px</span><span style="margin-left:auto;">Slide 07</span></div>
  </div>
</div>
</body>
</html>
