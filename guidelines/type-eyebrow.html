<!-- @dsCard group="Type" viewport="700x150" name="Eyebrow & labels" subtitle="// marker at -.18em, label uppercase .2em; section label .08em" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 22px; background: var(--surface-page); font-family: var(--font-text); }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .col { display: flex; flex-direction: column; }
  .sw { flex: 1; border-radius: var(--radius-tile); overflow: hidden; border: 1px solid var(--border); }
  .sw i { display: block; height: 56px; }
  .sw b { display: block; font-size: 13px; font-weight: 600; padding: 8px 10px 2px; color: var(--text-primary); }
  .sw code { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; padding: 0 10px 9px; color: var(--text-muted); }
  
</style>
</head>
<body>
<div class="col" style="gap:14px;">
  <div style="font-size:22px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--text-eyebrow);"><span style="color:var(--green-ink);letter-spacing:-.18em;margin-right:.32em;display:inline-block;">//</span>The Program</div>
  <div style="font-size:17px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green-label);">What they bring</div>
  <div style="font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);">The shift</div>
</div>
</body>
</html>
