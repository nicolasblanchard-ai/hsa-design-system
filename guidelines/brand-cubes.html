<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 22px; background: var(--surface-page); font-family: var(--font-text); }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .col { display: flex; flex-direction: column; }
  .sw { flex: 1; border-radius: var(--radius-tile); overflow: hidden; border: 1px solid var(--border); }
  .sw i { display: block; height: 56px; }
  .sw b { display: block; font-size: 13px; font-weight: 600; padding: 8px 10px 2px; color: var(--text-primary); }
  .sw code { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; padding: 0 10px 9px; color: var(--text-muted); }
  
</style>
</head>
<body>
<div class="row" style="align-items:center;">
  <img src="../assets/cubes/01-green.svg" alt="Cube 01" style="flex:1;max-height:120px;">
  <img src="../assets/cubes/02-green.svg" alt="Cube 02" style="flex:1;max-height:120px;">
  <img src="../assets/cubes/03-green.svg" alt="Cube 03" style="flex:1;max-height:120px;">
  <img src="../assets/cubes/04-green.svg" alt="Cube 04" style="flex:1;max-height:120px;">
  <div style="flex:1.2;position:relative;overflow:hidden;background:var(--navy);border-radius:var(--radius-tile);height:120px;"><img src="../assets/cubes/05-green.svg" alt="" style="position:absolute;right:-30px;bottom:-34px;width:150px;opacity:.16;"><span style="position:absolute;left:12px;top:10px;font-size:12px;color:var(--on-navy-body);">clipped, .16</span></div>
</div>
</body>
</html>
