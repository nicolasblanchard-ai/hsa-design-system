<!-- @dsCard group="Colors" viewport="700x150" name="Yellow - CTA & highlight" subtitle="#FFF70A is the website CTA fill; the tints flag drafts" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 22px; background: var(--surface-page); font-family: var(--font-text); }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .col { display: flex; flex-direction: column; }
  .sw { flex: 1; border-radius: var(--radius-tile); overflow: hidden; border: 1px solid var(--border); }
  .sw i { display: block; height: 56px; }
  .sw b { display: block; font-size: 13px; font-weight: 600; padding: 8px 10px 2px; color: var(--text-primary); }
  .sw code { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; padding: 0 10px 9px; color: var(--text-muted); }
  
</style>
</head>
<body>
<div class="row"><div class="sw"><i style="background:#FFF70A;"></i><b>yellow</b><code>#FFF70A · web CTA</code></div><div class="sw"><i style="background:#EFDF12;"></i><b>deep</b><code>#EFDF12 · hover</code></div><div class="sw"><i style="background:#FBF3C5;"></i><b>bg</b><code>#FBF3C5 · draft tile</code></div><div class="sw"><i style="background:#EAD98A;"></i><b>border</b><code>#EAD98A</code></div><div class="sw"><i style="background:#8A6D00;"></i><b>ink</b><code>#8A6D00</code></div><div class="sw"><i style="background:#12130F;"></i><b>ink-black</b><code>#12130F · on yellow</code></div></div>
</body>
</html>
