<!-- @dsCard group="Colors" viewport="700x150" name="Green family" subtitle="Ink and label greens carry text; tints and rules carry surfaces" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 22px; background: var(--surface-page); font-family: var(--font-text); }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .col { display: flex; flex-direction: column; }
  .sw { flex: 1; border-radius: var(--radius-tile); overflow: hidden; border: 1px solid var(--border); }
  .sw i { display: block; height: 56px; }
  .sw b { display: block; font-size: 13px; font-weight: 600; padding: 8px 10px 2px; color: var(--text-primary); }
  .sw code { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; padding: 0 10px 9px; color: var(--text-muted); }
  
</style>
</head>
<body>
<div class="row"><div class="sw"><i style="background:#12C48E;"></i><b>ink</b><code>#12C48E</code></div><div class="sw"><i style="background:#0F9E73;"></i><b>label</b><code>#0F9E73</code></div><div class="sw"><i style="background:#04412E;"></i><b>deep</b><code>#04412E</code></div><div class="sw"><i style="background:#F3FBF7;"></i><b>tint</b><code>#F3FBF7</code></div><div class="sw"><i style="background:#EAFBF4;"></i><b>tint-2</b><code>#EAFBF4</code></div><div class="sw"><i style="background:#D6F2E6;"></i><b>border</b><code>#D6F2E6</code></div><div class="sw"><i style="background:#E1F3EA;"></i><b>rule</b><code>#E1F3EA</code></div></div>
</body>
</html>
