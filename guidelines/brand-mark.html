<!-- @dsCard group="Brand" viewport="700x160" name="The // device" subtitle="Mark, section marker, divider rule, text device" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 22px; background: var(--surface-page); font-family: var(--font-text); }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .col { display: flex; flex-direction: column; }
  .sw { flex: 1; border-radius: var(--radius-tile); overflow: hidden; border: 1px solid var(--border); }
  .sw i { display: block; height: 56px; }
  .sw b { display: block; font-size: 13px; font-weight: 600; padding: 8px 10px 2px; color: var(--text-primary); }
  .sw code { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; padding: 0 10px 9px; color: var(--text-muted); }
  
</style>
</head>
<body>
<div class="row" style="align-items:center;gap:20px;">
  <img src="../assets/logo/mark-green-on-black.svg" alt="Mark, green on black" style="height:88px;">
  <img src="../assets/logo/mark-black-on-white.svg" alt="Mark, black on white" style="height:88px;">
  <div style="flex:1;display:flex;flex-direction:column;gap:12px;">
    <div style="font-size:18px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--text-eyebrow);"><span style="color:var(--green-ink);letter-spacing:-.18em;margin-right:.32em;display:inline-block;">//</span>Section marker</div>
    <div style="color:var(--green);font-weight:700;font-size:20px;letter-spacing:-.1em;overflow:hidden;white-space:nowrap;">////////////////////////////</div>
    <div style="font-size:15px;color:var(--text-body);"><span style="font-family:'IBM Plex Mono',monospace;">//</span> opens a comment or P.S. in social copy</div>
  </div>
</div>
</body>
</html>
