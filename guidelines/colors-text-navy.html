<!-- @dsCard group="Colors" viewport="700x230" name="Text on navy" subtitle="The dark-surface ramp, including the #274157 divider" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 22px; background: var(--surface-page); font-family: var(--font-text); }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .col { display: flex; flex-direction: column; }
  .sw { flex: 1; border-radius: var(--radius-tile); overflow: hidden; border: 1px solid var(--border); }
  .sw i { display: block; height: 56px; }
  .sw b { display: block; font-size: 13px; font-weight: 600; padding: 8px 10px 2px; color: var(--text-primary); }
  .sw code { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; padding: 0 10px 9px; color: var(--text-muted); }
  
</style>
</head>
<body>
<div class="col" style="gap:6px;background:#001D35;border-radius:var(--radius-tile);padding:16px 18px;">
  <div style="display:flex;justify-content:space-between;align-items:baseline;"><span style="font-size:21px;font-weight:600;color:#FFFFFF;">Headlines — on-navy</span><code style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#7FA6BC;">#FFFFFF</code></div>
  <div style="display:flex;justify-content:space-between;align-items:baseline;"><span style="font-size:20px;color:#AFC7D4;">Body — on-navy-body</span><code style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#7FA6BC;">#AFC7D4</code></div>
  <div style="display:flex;justify-content:space-between;align-items:baseline;"><span style="font-size:19px;font-weight:500;color:#E6EDF1;">Emphasis band — on-navy-soft</span><code style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#7FA6BC;">#E6EDF1</code></div>
  <div style="display:flex;justify-content:space-between;align-items:baseline;"><span style="font-size:18px;color:#7FA6BC;">Labels — on-navy-muted</span><code style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#7FA6BC;">#7FA6BC</code></div>
  <div style="height:1px;background:#274157;margin-top:6px;"></div>
  <div style="font-size:13px;color:#7FA6BC;">divider — on-navy-rule #274157</div>
</div>
</body>
</html>
