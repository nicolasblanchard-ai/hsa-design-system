<!-- @dsCard group="Type" viewport="700x160" name="Figures" subtitle="Semi Condensed 600 at 150 / 56 / 52 / 40 / 34px - numbers are display type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 22px; background: var(--surface-page); font-family: var(--font-text); }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .col { display: flex; flex-direction: column; }
  .sw { flex: 1; border-radius: var(--radius-tile); overflow: hidden; border: 1px solid var(--border); }
  .sw i { display: block; height: 56px; }
  .sw b { display: block; font-size: 13px; font-weight: 600; padding: 8px 10px 2px; color: var(--text-primary); }
  .sw code { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; padding: 0 10px 9px; color: var(--text-muted); }
  
</style>
</head>
<body>
<div class="row" style="align-items:baseline;gap:28px;font-family:var(--font-display);font-weight:600;color:var(--text-primary);">
  <span style="font-size:76px;line-height:1;">~85%</span>
  <span style="font-size:52px;line-height:1;">16–20</span>
  <span style="font-size:40px;line-height:1;">CHF 15k</span>
  <span style="font-size:34px;line-height:1;">6'000+</span>
  <span style="font-size:34px;line-height:1;color:var(--green-ink);">≈0.3%</span>
</div>
</body>
</html>
