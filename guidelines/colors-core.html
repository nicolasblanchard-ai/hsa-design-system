<!-- @dsCard group="Colors" viewport="700x150" name="Core" subtitle="Navy, mint, white - every surface is built from these" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 22px; background: var(--surface-page); font-family: var(--font-text); }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .col { display: flex; flex-direction: column; }
  .sw { flex: 1; border-radius: var(--radius-tile); overflow: hidden; border: 1px solid var(--border); }
  .sw i { display: block; height: 56px; }
  .sw b { display: block; font-size: 13px; font-weight: 600; padding: 8px 10px 2px; color: var(--text-primary); }
  .sw code { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; padding: 0 10px 9px; color: var(--text-muted); }
  
</style>
</head>
<body>
<div class="row"><div class="sw"><i style="background:#001D35;"></i><b>Navy</b><code>#001D35 · text, dark surfaces</code></div><div class="sw"><i style="background:#54F7BE;"></i><b>Mint green</b><code>#54F7BE · accent, top rule</code></div><div class="sw"><i style="background:#FFFFFF;border-bottom:1px solid var(--border);"></i><b>White</b><code>#FFFFFF · page field</code></div></div>
</body>
</html>
