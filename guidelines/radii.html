<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="16 cards · 14 bands · 12 tiles · 10 chips · 8 buttons" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 22px; background: var(--surface-page); font-family: var(--font-text); }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .col { display: flex; flex-direction: column; }
  .sw { flex: 1; border-radius: var(--radius-tile); overflow: hidden; border: 1px solid var(--border); }
  .sw i { display: block; height: 56px; }
  .sw b { display: block; font-size: 13px; font-weight: 600; padding: 8px 10px 2px; color: var(--text-primary); }
  .sw code { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; padding: 0 10px 9px; color: var(--text-muted); }
  
</style>
</head>
<body>
<div class="row">
  <div style="flex:1;border:1px solid var(--border);border-radius:16px;padding:18px 10px;text-align:center;"><div style="font-family:'IBM Plex Mono',monospace;font-size:17px;">16</div><div style="font-size:13px;color:var(--text-muted);">cards</div></div>
  <div style="flex:1;border:1px solid var(--border);border-radius:14px;padding:18px 10px;text-align:center;"><div style="font-family:'IBM Plex Mono',monospace;font-size:17px;">14</div><div style="font-size:13px;color:var(--text-muted);">bands</div></div>
  <div style="flex:1;border:1px solid var(--border);border-radius:12px;padding:18px 10px;text-align:center;"><div style="font-family:'IBM Plex Mono',monospace;font-size:17px;">12</div><div style="font-size:13px;color:var(--text-muted);">tiles</div></div>
  <div style="flex:1;border:1px solid var(--border);border-radius:10px;padding:18px 10px;text-align:center;"><div style="font-family:'IBM Plex Mono',monospace;font-size:17px;">10</div><div style="font-size:13px;color:var(--text-muted);">chips</div></div>
  <div style="flex:1;border:1px solid var(--border);border-radius:8px;padding:18px 10px;text-align:center;"><div style="font-family:'IBM Plex Mono',monospace;font-size:17px;">8</div><div style="font-size:13px;color:var(--text-muted);">buttons</div></div>
  <div style="flex:1.4;border:1px solid var(--border);border-top:4px solid var(--green);border-radius:0 0 14px 14px;padding:16px 12px;text-align:center;"><div style="font-family:'IBM Plex Mono',monospace;font-size:13px;">0 0 14 14</div><div style="font-size:13px;color:var(--text-muted);">top-accent card</div></div>
</div>
</body>
</html>
