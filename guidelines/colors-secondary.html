<!-- @dsCard group="Colors" viewport="700x150" name="Secondary - syntax highlighting" subtitle="Sparse accents and the chart ramp, in order - never large fields" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 18px 22px; background: var(--surface-page); font-family: var(--font-text); }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .col { display: flex; flex-direction: column; }
  .sw { flex: 1; border-radius: var(--radius-tile); overflow: hidden; border: 1px solid var(--border); }
  .sw i { display: block; height: 56px; }
  .sw b { display: block; font-size: 13px; font-weight: 600; padding: 8px 10px 2px; color: var(--text-primary); }
  .sw code { display: block; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; padding: 0 10px 9px; color: var(--text-muted); }
  
</style>
</head>
<body>
<div class="row"><div class="sw"><i style="background:#54F7BE;"></i><b>chart-1 mint</b><code>#54F7BE</code></div><div class="sw"><i style="background:#00A1D2;"></i><b>chart-2 blue</b><code>#00A1D2</code></div><div class="sw"><i style="background:#FB9800;"></i><b>chart-3 orange</b><code>#FB9800</code></div><div class="sw"><i style="background:#CC4278;"></i><b>chart-4 pink</b><code>#CC4278</code></div><div class="sw"><i style="background:#FFF70A;"></i><b>chart-5 yellow</b><code>#FFF70A</code></div><div class="sw"><i style="background:#DA291C;"></i><b>negative</b><code>#DA291C · data only</code></div></div>
</body>
</html>
