<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); }
  .slide { position: relative; width: 1280px; height: 720px; background: var(--white); overflow: hidden; font-family: var(--font-text); color: var(--text-primary); }
  .rule { position: absolute; top: 0; left: 0; right: 0; height: 5px; background: var(--green); }
  .eyebrow { position: absolute; top: 40px; left: 48px; font-size: 15px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--text-eyebrow); }
  .eyebrow s { text-decoration: none; color: var(--green-ink); letter-spacing: -.18em; margin-right: .32em; display: inline-block; }
  .title { position: absolute; left: 48px; top: 100px; font-family: var(--font-display); font-weight: 600; font-size: 53px; line-height: 1; letter-spacing: -.005em; }
  .sub { margin-top: 16px; font-family: var(--font-text); font-weight: var(--weight-regular); font-size: 19px; line-height: 1.45; letter-spacing: 0; color: var(--text-body); max-width: 790px; }
  .foot { position: absolute; left: 48px; bottom: 27px; display: flex; align-items: center; gap: 19px; }
  .foot img { height: 15px; }
  .foot span, .num { font-size: 11px; color: var(--text-footer); }
  .num { position: absolute; right: 48px; bottom: 27px; }
</style>
</head>
<body>
<div class="slide">
  <div class="rule"></div>
  <img src="../assets/cubes/01-green.svg" alt="" style="position:absolute;right:-60px;bottom:-90px;width:520px;opacity:.5;">
  <div style="position:absolute;left:48px;top:248px;">
    <div style="font-size:15px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--text-eyebrow);"><span style="color:var(--green-ink);letter-spacing:-.18em;margin-right:.32em;display:inline-block;">//</span>Partner Deck — February 2026</div>
    <div style="font-family:var(--font-display);font-size:81px;font-weight:600;line-height:.94;margin-top:19px;">
      <div>HSG START</div>
      <div style="color:var(--green-ink);">ACCELERATOR</div>
    </div>
    <div style="margin-top:23px;font-size:21px;font-weight:500;color:var(--text-body);max-width:640px;">Acceleration through access — turning European deep-tech research into investable companies.</div>
    <div style="margin-top:27px;display:flex;gap:11px;">
      <span style="display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--border-strong);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#1B3341;"><span style="width:12px;height:7px;background:var(--green);"></span>Deep-Tech</span>
      <span style="display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--border-strong);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#1B3341;"><span style="width:12px;height:7px;background:var(--green);"></span>2 Cohorts / Year</span>
      <span style="display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--border-strong);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#1B3341;"><span style="width:12px;height:7px;background:var(--green);"></span>Investor-Ready</span>
    </div>
  </div>
  <div class="foot"><img src="../assets/logo/oneline-black.png" alt="HSG START ACCELERATOR"><span>www.hsgstartaccelerator.org</span></div>
</div>
</body>
</html>
