<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Core components</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px 24px;background:var(--surface-page);} .row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;} .grid{display:grid;gap:14px;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function ds(name) {
  for (const k of Object.getOwnPropertyNames(window)) {
    let v; try { v = window[k]; } catch (e) { continue; }
    if (v && typeof v === "object" && typeof v[name] === "function") return v[name];
  }
  return function Missing() { return <span style={{fontFamily:"var(--font-text)",color:"var(--text-faint)"}}>{name} unavailable</span>; };
}

const Button = ds("Button"), Eyebrow = ds("Eyebrow"), Bullet = ds("Bullet"), Chip = ds("Chip"), SlashRule = ds("SlashRule");
function Demo() {
  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div className="row">
        <Button variant="cta" size="s">Apply now</Button>
        <Button variant="primary" size="s">Become a partner</Button>
        <Button variant="navy" size="s">Program</Button>
        <Button variant="outline" size="s">Download deck</Button>
        <Button variant="cta" size="s" disabled>Disabled</Button>
      </div>
      <div className="row" style={{gap:24}}>
        <Eyebrow style={{fontSize:14}}>The Program</Eyebrow>
        <Chip tone="value" style={{fontSize:14,padding:"7px 12px"}}>CHF 15k + 200k</Chip>
        <Chip tone="outline" marker style={{fontSize:13,padding:"7px 12px"}}>Investor-Ready</Chip>
        <Chip tone="draft" pill style={{fontSize:12,padding:"6px 14px"}}>Draft · to tailor</Chip>
      </div>
      <div className="row" style={{gap:28}}>
        <Bullet size={12} style={{gap:10}}><span style={{fontSize:15}}>Square mint marker, never a disc</span></Bullet>
      </div>
      <SlashRule size={18} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
