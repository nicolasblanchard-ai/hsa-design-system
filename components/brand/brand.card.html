<!-- @dsCard group="Components" viewport="700x200" name="Brand" subtitle="Logo lockups and the cube watermark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand components</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px 24px;background:var(--surface-page);} .row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;} .grid{display:grid;gap:14px;}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function ds(name) {
  for (const k of Object.getOwnPropertyNames(window)) {
    let v; try { v = window[k]; } catch (e) { continue; }
    if (v && typeof v === "object" && typeof v[name] === "function") return v[name];
  }
  return function Missing() { return <span style={{fontFamily:"var(--font-text)",color:"var(--text-faint)"}}>{name} unavailable</span>; };
}

const Logo = ds("Logo"), CubeWatermark = ds("CubeWatermark");
function Demo() {
  return (
    <div className="grid" style={{gridTemplateColumns:"1fr 1fr 1fr",alignItems:"center"}}>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <Logo lockup="oneline-green" width={210} base="../../" />
        <Logo lockup="oneline-black" width={210} base="../../" />
      </div>
      <div style={{background:"var(--navy)",borderRadius:"var(--radius-tile)",padding:"18px 20px",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <Logo lockup="stacked-white" width={150} base="../../" />
      </div>
      <div style={{position:"relative",overflow:"hidden",background:"var(--navy)",borderRadius:"var(--radius-tile)",height:120}}>
        <CubeWatermark cube="03" size={200} opacity={0.18} base="../../" />
        <span style={{position:"absolute",left:16,top:14,fontFamily:"var(--font-text)",fontSize:13,color:"var(--on-navy-body)"}}>clipped watermark</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
